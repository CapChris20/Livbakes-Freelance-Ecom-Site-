<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us - LivBakes</title>
    <link rel="stylesheet" href="contactus.css" />
  </head>

  <body class="contact-body">
    <main class="contact-wrapper">

      <h1 class="contact-title">Contact Us</h1>
      <p class="email-note">
        Email us directly at
        <a href="mailto:oliviagarza222@gmail.com">oliviagarza222@gmail.com</a>
      </p>

      <form
        class="contact-form"
        action="mailto:oliviagarza222@gmail.com"
        method="POST"
      >
        <label for="email">Your Email</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="you@example.com"
          required
        />
        <button type="submit">Send</button>
      </form>

      <div class="insta-wrapper">
        <p>Follow us on Instagram</p>
        <a
          href="https://www.instagram.com/livsmacarons/"
          target="_blank"
          class="insta-link"
          >@livsmacarons</a
        >
      </div>

      <a href="index.html" class="back-link">← Back to Menu</a>
    </main>
  </body>
</html>
