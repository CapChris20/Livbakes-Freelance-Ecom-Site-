<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Products</title>
  <link rel="stylesheet" href="products.css" />
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.snipcart.com/themes/v3.3.0/default/snipcart.css" />
</head>
<body>

  <!-- Navbar -->
  <div class="navbar">
    <a href="index.html" class="nav-btn">&larr; Back to Menu</a>
    <h2 class="products-name">Macarons</h2>
    <button class="snipcart-checkout nav-btn">
      🛒 Cart (<span class="snipcart-total-items"></span>)
    </button>
  </div>

  <!-- Product Grid -->
  <div class="container">
    <div class="main">
      <div class="product-wrapper">

        <!-- Fruity Pebbles -->
        <div class="product">
          <img class="product-img" src="fruity.JPG" alt="Fruity Pebbles Macarons" />
          <h3 class="product-title">Fruity Pebbles Macarons (Box of 6)</h3>
          <p class="product-price">$14.99</p>
          <button class="button snipcart-add-item"
            data-item-id="fruity-macarons"
            data-item-name="Fruity Pebbles Macarons"
            data-item-price="14.99"
            data-item-url="https://livbakes-ecom.netlify.app/product.html"
            data-item-image="fruity.JPG"
            data-item-description="Box of 6 Fruity Pebbles Macarons"
            data-item-custom1-name="Fulfillment Method"
            data-item-custom1-options="Pickup|Delivery">
            Add to Cart
          </button>
        </div>

        <!-- Chocolate -->
        <div class="product">
          <img class="product-img" src="chocolate-1.JPG" alt="Chocolate Macarons" />

            data-item-id="chocolate-macarons"

            data-item-custom1-name="Fulfillment Method"
            data-item-custom1-options="Pickup|Delivery">

            data-item-price="15.99"

            data-item-description="Box of 6 Strawberry Macarons"
            data-item-custom1-name="Fulfillment Method"

          <p class="product-price">$15.99</p>
          <button class="button snipcart-add-item"
            data-item-id="cpb-macarons"
            data-item-name="Chocolate Peanut Butter Macarons"
            data-item-price="15.99"
            data-item-url="https://livbakes-ecom.netlify.app/product.html"
            data-item-image="cpb.JPG"
            data-item-description="Box of 6 Chocolate Peanut Butter Macarons"
            data-item-custom1-name="Fulfillment Method"
            data-item-custom1-options="Pickup|Delivery">

  <!-- Snipcart Config -->
  <div hidden id="snipcart" 
       data-api-key="ZmVlZDUyYTItNjQ0ZS00MmY1LTk5NzYtOGE3NTJkN2VhMjlmNjM4Nzg4MjIzNDEwOTk4Njky"
       data-config-modal-style="side">
